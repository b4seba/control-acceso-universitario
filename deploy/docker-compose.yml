version: '3.8'

services:
  # ============================================================================
  # 1. Base de Datos Relacional Central: PostgreSQL 16 con Auditoría Criptográfica
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ua_postgres_16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ua2026pass
      POSTGRES_DB: ua_access_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ua_access_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ua_network

  # ============================================================================
  # 2. Base de Datos Vectorial: Qdrant Vector DB (Zero-Trust Biométrico 512D)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: ua_qdrant_vectors
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ua_network

  # ============================================================================
  # 3. Microservicio de Ingesta Central en Golang (Worker Pools & Hash-Chaining)
  # ============================================================================
  ingestion_service:
    build:
      context: ../services/ingestion
      dockerfile: Dockerfile
    container_name: ua_ingestion_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:ua2026pass@postgres:5432/ua_access_db?sslmode=disable"
      QDRANT_URL: "http://qdrant:6333"
    networks:
      - ua_network

volumes:
  pgdata:
    driver: local
  qdrant_storage:
    driver: local

networks:
  ua_network:
    driver: bridge
